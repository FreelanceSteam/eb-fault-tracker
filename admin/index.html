
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00180d">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./admin-icon-192.png">

  <title>EB Fault Tracker — Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 35%, #07532b 0%, transparent 55%),
        linear-gradient(145deg, #00180d, #002b17 55%, #000b06);
    }

    .app {
      width: min(100%, 520px);
      padding: 20px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 340px;
      height: auto;
      margin: 0 auto 20px;
      border-radius: 24px;
      filter: drop-shadow(0 12px 22px #0009);
    }

    h1 {
      margin: 12px 0 6px;
      font-size: clamp(27px, 6vw, 36px);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 3px 10px #0008;
    }

    p {
      margin: 8px 0 26px;
      color: #d2f5df;
      font-size: 16px;
      letter-spacing: 4px;
    }

    button {
      display: block;
      width: 100%;
      padding: 19px 16px;
      border: 2px solid #8cffb0;
      border-radius: 18px;
      background: linear-gradient(100deg, #8dff39, #00c853);
      color: #002713;
      font-size: 23px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 25px #00e67640;
    }

    button:active {
      transform: scale(.99);
    }

    .warning {
      margin-top: 22px;
      padding: 14px;
      border: 1px solid #d9a900;
      border-radius: 14px;
      background: #201b08;
      color: #f6e8b4;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
    }

    .warning b {
      color: #ffda32;
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .app { padding: 10px; }
      .logo { max-width: 300px; }
    }
  </style>
</head>

<body>
  <main class="app">

    <img
      class="logo"
      src="./admin-logo.png"
      alt="EB Fault Tracker Admin logo"
    >

    <h1>EB Fault Tracker</h1>
    <p>ADMIN APP</p>

    <button id="openBtn" type="button">
      ADMIN &nbsp; ›
    </button>

    <div class="warning">
      <b>Security note:</b>
      Admin access should be protected by verified
      server-side authentication. Do not share
      private access links publicly.
    </div>

  </main>

  <script>
    const ADMIN_LINK =
      "https://script.google.com/macros/s/AKfycby6JeKwcW9kNGFD47pOJ4tp0uGMrnu6jnBrP6C8YaTNtoyurgJ7381B8ZK3UqkfylqjOA/exec?page=admin";

    document.getElementById("openBtn").addEventListener("click", function () {
      window.location.href = ADMIN_LINK;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(function () {});
      });
    }
  </script>
</body>
</html>

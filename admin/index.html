
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#008b61">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./admin-icon-192.png">

  <title>EB Fault Tracker — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #e4fff3, #d5f7e7);
      color: #003d2c;
    }

    .app {
      width: min(100%, 430px);
      padding: 18px;
      background: #fff;
      border-radius: 26px;
      box-shadow: 0 18px 45px #075e3b25;
      text-align: center;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 330px;
      height: auto;
      border-radius: 22px;
      margin: 0 auto 14px;
    }

    h1 {
      font-size: 25px;
      margin: 8px 0 4px;
    }

    p {
      color: #526b60;
      line-height: 1.45;
      font-size: 14px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 700;
      font-size: 13px;
      margin: 16px 0 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #b9dfcc;
      border-radius: 12px;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      background: linear-gradient(90deg, #8dff39, #00c853);
      color: #003d2c;
      font-weight: 800;
      font-size: 18px;
      margin-top: 14px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .warning {
      background: #fff7df;
      border: 1px solid #f1d28a;
      padding: 10px;
      border-radius: 12px;
      color: #6a4a00;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="app">

    <img
      class="logo"
      src="./admin-logo.png"
      alt="EB Fault Tracker Admin logo"
    >

    <h1>EB Fault Tracker</h1>
    <p>Admin App</p>

    <label for="adminLink">Admin access link</label>

    <input
      id="adminLink"
      type="url"
      placeholder="Paste your approved Admin link"
      autocomplete="url"
    >

    <button id="openBtn" type="button">
  ADMIN
</button>

    <div class="warning">
      <b>Security note:</b>
      Do not share the Admin link publicly until
      server-side authentication has been implemented
      and verified.
    </div>

  </main>

  <script>
    const input = document.getElementById("adminLink");
    const openBtn = document.getElementById("openBtn");

    try {
      input.value =
        localStorage.getItem("ebAdminAccessLink") || "";
    } catch (e) {}

    openBtn.addEventListener("click", function () {
      const value = input.value.trim();
      let url;

      try {
        url = new URL(value);
      } catch (e) {
        alert("Please paste the approved Admin access link first.");
        return;
      }

      if (
        url.protocol !== "https:" ||
        url.hostname !== "script.google.com" ||
        !url.pathname.includes("/macros/s/")
      ) {
        alert("Please use the official Google Apps Script web-app link.");
        return;
      }

      if (url.searchParams.get("page") !== "admin") {
        alert("The Admin link must include page=admin.");
        return;
      }

      try {
        localStorage.setItem("ebAdminAccessLink", url.href);
      } catch (e) {}

      window.location.href = url.href;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(function () {});
      });
    }
  </script>
</body>
</html>

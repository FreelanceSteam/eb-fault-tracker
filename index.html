<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06245e"><title>EB Fault Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef5ff,#f7fbff);color:#123b73;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.wrap{width:min(100%,1050px);text-align:center}.brand{font-size:clamp(28px,4vw,42px);font-weight:900;margin:0 0 8px;color:#07356d}.sub{margin:0 0 24px;color:#526782}.tiles{width:100%;height:auto;display:block;border-radius:20px;box-shadow:0 12px 30px #123b7322;margin:0 auto 22px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.btn{display:block;border:0;border-radius:14px;padding:17px 12px;font-size:18px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 5px 0 #0002;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.tech{background:linear-gradient(135deg,#ffdc00,#ff9f00);color:#082d65}.admin{background:linear-gradient(135deg,#83f13a,#00bf58);color:#043c2a}.note{font-size:13px;color:#64748b;line-height:1.5;margin:18px auto 0;max-width:720px}@media(max-width:600px){body{padding:12px}.actions{grid-template-columns:1fr}.btn{font-size:16px}.tiles{border-radius:12px}}
</style>
</head>
<body><main class="wrap"><h1 class="brand">EB Fault Tracker</h1><p class="sub">Choose your app to continue</p><img class="tiles" src="app-tiles.png" alt="EB Fault Tracker Technician and Admin app tiles"><div class="actions"><button class="btn tech" onclick="openTechnician()">🔧 Technician App</button><a class="btn admin" href="https://script.google.com/macros/s/AKfycby6JeKwcW9kNGFD47pOJ4tp0uGMrnu6jnBrP6C8YaTNtoyurgJ7381B8ZK3UqkfylqjOA/exec?page=admin">📊 Admin Dashboard</a></div><p class="note">Technician access is protected by an individual access link. Paste your existing technician link when prompted; it is not saved on this public homepage.</p></main>
<script>function openTechnician(){const link=prompt('Paste your existing personal Technician access link:');if(!link)return;try{const u=new URL(link);if(u.hostname!=='script.google.com'){alert('Please paste your official Google Apps Script Technician link.');return;}location.href=u.href;}catch(e){alert('That link does not look valid. Please paste the full Technician access link.');}}</script></body></html>

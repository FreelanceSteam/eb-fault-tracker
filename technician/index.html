<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0754c8"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./technician-icon-192.png"><title>EB Fault Tracker — Technician</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(160deg,#eaf4ff,#d9e9ff);display:flex;align-items:center;justify-content:center;padding:18px;color:#09285c}.app{width:min(100%,430px);background:#fff;border-radius:26px;padding:18px;box-shadow:0 18px 45px #123d6a26;text-align:center}.logo{width:min(100%,330px);height:auto;border-radius:22px;display:block;margin:0 auto 14px}h1{font-size:25px;margin:8px 0 4px}p{color:#52657f;line-height:1.45;font-size:14px}label{display:block;text-align:left;font-weight:700;font-size:13px;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #c5d5ec;border-radius:12px;font-size:14px}button{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(90deg,#ffd500,#ff9d00);color:#06245d;font-weight:800;font-size:18px;margin-top:14px;cursor:pointer}.note{font-size:12px;color:#61718a;margin-top:12px}</style></head><body><main class="app"><img class="logo" src="./technician-logo.png" alt="EB Fault Tracker Technician logo"><h1>EB Fault Tracker</h1><p>Technician App</p><label for="techLink">Your individual Technician access link</label><input id="techLink" type="url" placeholder="Paste your own link ending with /exec?token=…" autocomplete="url"><button id="openBtn">OPEN</button><p class="note">Your link is saved only on this device. Do not use another technician’s link.</p></main><script>const input=document.getElementById('techLink');try{input.value=localStorage.getItem('ebTechAccessLink')||''}catch(e){}document.getElementById('openBtn').addEventListener('click',()=>{const value=input.value.trim();let url;try{url=new URL(value)}catch(e){alert('Please paste your individual Technician access link first.');return}if(url.protocol!=='https:'||url.hostname!=='script.google.com'||!url.pathname.includes('/macros/s/')){alert('Please paste the original Google Apps Script Technician link.');return}if(!url.searchParams.has('token')){alert('This link does not contain a technician token.');return}try{localStorage.setItem('ebTechAccessLink',url.href)}catch(e){}location.href=url.href});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061B4A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./technician-icon-192.png">
<title>EB Fault Tracker — Technician</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font-family:Arial,sans-serif;color:#fff;
  background:radial-gradient(ellipse at 50% 20%,#164e9c 0%,#092b63 42%,#031332 100%);
  display:flex;align-items:center;justify-content:center;
  padding:24px 18px;overflow-x:hidden
}
.app{width:min(100%,420px);text-align:center;position:relative}
.topline{
  width:70px;height:5px;border-radius:9px;
  background:linear-gradient(90deg,#ffd500,#ff9d00);
  margin:0 auto 22px;box-shadow:0 0 18px #ffc40066
}
.logo{
  display:block;width:min(100%,330px);height:auto;
  margin:0 auto 24px;border-radius:22px;
  filter:drop-shadow(0 16px 30px #0007)
}
h1{font-size:clamp(27px,7vw,35px);margin:0 0 8px;font-weight:800;letter-spacing:.2px}
.subtitle{color:#c4dcff;font-size:15px;margin:0 0 26px}
.formbox{
  text-align:left;padding:18px 0;
  border-top:1px solid #ffffff24;
  border-bottom:1px solid #ffffff24
}
label{display:block;font-weight:700;font-size:13px;margin:0 0 9px;color:#e5efff}
input{
  display:block;width:100%;padding:15px 14px;
  border:1px solid #7195c9;border-radius:14px;
  background:#071b3b;color:#fff;font-size:14px;outline:none
}
input:focus{border-color:#ffd500;box-shadow:0 0 0 3px #ffd50020}
input::placeholder{color:#9aafd0}
button{
  display:block;width:100%;margin-top:18px;padding:16px;
  border:0;border-radius:15px;
  background:linear-gradient(110deg,#ffe45c,#ffb900 55%,#ff9500);
  color:#092657;font-size:18px;font-weight:900;letter-spacing:1px;
  box-shadow:0 8px 25px #ffb90030;cursor:pointer
}
button:active{transform:scale(.985)}
.note{font-size:12px;line-height:1.6;color:#b9cfee;margin:17px 0 0}
.footer{font-size:12px;color:#d7e5ff;margin-top:27px}
.footer span{color:#ffd500;font-weight:700}
</style>
</head>
<body>
<main class="app">
  <div class="topline"></div>
  <img class="logo" src="./technician-logo.png" alt="EB Fault Tracker Technician logo">
  <h1>EB Fault Tracker</h1>
  <p class="subtitle">Technician App</p>

  <div class="formbox">
    <label for="techLink">Your individual Technician access link</label>
    <input id="techLink" type="url"
      placeholder="Paste your personal access link"
      autocomplete="url">
    <button id="openBtn" type="button">OPEN&nbsp; →</button>
  </div>

  <p class="note">Use only your own access link.<br>Your link is saved on this device.</p>
  <div class="footer">Designed by <span>Nagendra Yadav</span></div>
</main>

<script>
const input=document.getElementById('techLink');

try {
  input.value=localStorage.getItem('ebTechAccessLink')||'';
} catch(e) {}

document.getElementById('openBtn').addEventListener('click',()=>{
  const value=input.value.trim();
  let url;

  try {
    url=new URL(value);
  } catch(e) {
    alert('Please enter your individual Technician access link.');
    return;
  }

  if(url.protocol!=='https:' ||
     url.hostname!=='script.google.com' ||
     !url.pathname.includes('/macros/s/')) {
    alert('Please use the original Google Apps Script Technician link.');
    return;
  }

  if(!url.searchParams.has('token')) {
    alert('This link does not contain a technician token.');
    return;
  }

  try {
    localStorage.setItem('ebTechAccessLink',url.href);
  } catch(e) {}

  location.href=url.href;
});

if('serviceWorker' in navigator) {
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b49">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./technician-icon-192.png">
<title>EB Fault Tracker — Technician</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;color:#fff;
  background:linear-gradient(145deg,#06143a,#09285c,#003b68);
}
.app{
  width:min(100%,490px);padding:14px;
  background:#071b49;border:2px solid #17376d;
  border-radius:24px;box-shadow:0 18px 45px #0005;
  text-align:center;
}
.logo{
  display:block;width:100%;height:auto;
  aspect-ratio:1/1;object-fit:contain;
  border-radius:16px;margin:0 auto 14px;
}
h1{font-size:24px;margin:12px 0 8px;color:#fff}
.subtitle{color:#c5d8ff;font-size:16px;margin:0 0 20px}
label{
  display:block;text-align:left;font-weight:700;
  font-size:14px;margin:16px 0 8px;color:#fff;
}
input{
  width:100%;padding:14px;border:1px solid #9bb8e8;
  border-radius:12px;font-size:14px;background:#fff;color:#14284d;
}
button{
  width:100%;padding:16px;margin-top:15px;
  border:0;border-radius:14px;
  background:linear-gradient(90deg,#ffd000,#ffad00);
  color:#061b49;font-weight:800;font-size:19px;
  cursor:pointer;
}
button:active{transform:scale(.99)}
.note{font-size:12px;line-height:1.5;color:#c5d8ff;margin:14px 4px 8px}
.footer{font-size:12px;color:#f8d55b;margin-top:18px}
</style>
</head>

<body>
<main class="app">
  <img class="logo" src="./technician-logo.png"
       alt="EB Fault Tracker Technician logo">

  <h1>EB Fault Tracker</h1>
  <p class="subtitle">Technician App</p>

  <label for="techLink">Your individual Technician access link</label>
  <input id="techLink" type="url"
         placeholder="Paste your own link ending with /exec?token=…"
         autocomplete="url">

  <button id="openBtn">OPEN →</button>

  <p class="note">
    Your link is saved only on this device.
    Do not use another technician’s link.
  </p>

  <div class="footer">Designed by Nagendra Yadav</div>
</main>

<script>
const input=document.getElementById('techLink');

try {
  input.value=localStorage.getItem('ebTechAccessLink')||'';
} catch(e) {}

document.getElementById('openBtn').addEventListener('click',()=>{
  const value=input.value.trim();
  let url;

  try {
    url=new URL(value);
  } catch(e) {
    alert('Please paste your individual Technician access link first.');
    return;
  }

  if(
    url.protocol!=='https:' ||
    url.hostname!=='script.google.com' ||
    !url.pathname.includes('/macros/s/')
  ) {
    alert('Please paste the original Google Apps Script Technician link.');
    return;
  }

  if(!url.searchParams.has('token')) {
    alert('This link does not contain a technician token.');
    return;
  }

  try {
    localStorage.setItem('ebTechAccessLink',url.href);
  } catch(e) {}

  location.href=url.href;
});

if('serviceWorker' in navigator) {
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b49">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./technician-icon-192.png">
<title>EB Fault Tracker — Technician</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  color:#fff;
  background:linear-gradient(145deg,#06143a,#09285c,#003b68);
}

.app{
  width:min(100%,490px);
  padding:14px;
  background:#071b49;
  border:2px solid #17376d;
  border-radius:24px;
  box-shadow:0 18px 45px #0005;
  text-align:center;
}

.logo{
  display:block;
  width:100%;
  max-width:440px;
  height:auto;
  aspect-ratio:1/1;
  object-fit:contain;
  border-radius:16px;
  margin:0 auto 12px;
}

button{
  display:block;
  width:100%;
  padding:17px 14px;
  margin:12px auto 0;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#ffd000,#ffad00);
  color:#061b49;
  font-weight:800;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 7px 18px #0003;
}

button:active{transform:scale(.99)}

.footer{
  font-size:12px;
  color:#f8d55b;
  margin:16px 0 4px;
}

@media(max-width:480px){
  body{padding:12px}
  .app{padding:10px;border-radius:20px}
  .logo{max-width:100%;margin-bottom:8px}
  button{font-size:19px;padding:16px}
}

@media(max-height:700px){
  body{align-items:flex-start}
  .app{margin:auto 0}
  .logo{max-width:min(100%,300px)}
}
</style>
</head>

<body>
<main class="app">

  <img
    class="logo"
    src="./technician-logo.png"
    alt="EB Fault Tracker Technician logo"
  >

  <button id="openBtn" type="button">OPEN →</button>

  <div class="footer">Designed by Nagendra Yadav</div>

</main>

<script>
document.getElementById('openBtn').addEventListener('click',()=>{
  let value='';

  try{
    value=localStorage.getItem('ebTechAccessLink')||'';
  }catch(e){}

  if(!value){
    alert('Technician access link is not saved on this device. Please open the previous version once and save your individual link.');
    return;
  }

  let url;

  try{
    url=new URL(value);
  }catch(e){
    alert('Saved Technician link is invalid. Please save the correct individual access link.');
    return;
  }

  if(
    url.protocol!=='https:' ||
    url.hostname!=='script.google.com' ||
    !url.pathname.includes('/macros/s/') ||
    !url.searchParams.has('token')
  ){
    alert('Saved Technician link is invalid. Please use your original individual access link.');
    return;
  }

  location.href=url.href;
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
